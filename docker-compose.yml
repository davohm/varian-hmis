# Deployment-only PostgreSQL service.
# Local development uses the installed PostgreSQL 17 database "varian-hmis-db".

services:
  postgres:
    image: postgres:17
    container_name: varian-hmis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-varian-hmis}
      POSTGRES_USER: ${POSTGRES_USER:-varian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your deployment .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-varian} -d ${POSTGRES_DB:-varian-hmis}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
